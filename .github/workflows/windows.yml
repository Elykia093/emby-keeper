name: Windows Release Build

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to upload assets to
        required: true
        default: v7.6.7
  release:
    types: [released]

env:
  RELEASE_TAG: ${{ github.event.release.tag_name || github.event.inputs.tag || github.ref_name }}
  WIN_SCRIPT_ZIP_NAME: 'embykeeper-win-${{ github.event.release.tag_name || github.event.inputs.tag || github.ref_name }}.zip'
  WIN_GUI_EXE_NAME: 'embykeeper-win-${{ github.event.release.tag_name || github.event.inputs.tag || github.ref_name }}.exe'

permissions:
  contents: write

jobs:
  win-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
      - name: Verify Windows release version
        shell: bash
        run: |
          python - <<'PY'
          import ast
          import configparser
          import os
          from pathlib import Path
          import re
          import tomllib

          tag = os.environ["RELEASE_TAG"]
          if not re.fullmatch(r"v\d+\.\d+\.\d+", tag):
              raise SystemExit("The Windows release tag must be a stable vX.Y.Z version.")
          expected = tag[1:]
          package = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          installer = configparser.ConfigParser()
          installer.read("installer.cfg")
          core = next(
              ast.literal_eval(node.value)
              for node in ast.parse(Path("embykeeper/__init__.py").read_text()).body
              if isinstance(node, ast.Assign)
              and any(isinstance(target, ast.Name) and target.id == "__version__" for target in node.targets)
          )
          requirements = Path("windows/installer-script/script/requirements.txt").read_text().strip()
          if (package, core, installer["Application"]["version"], requirements) != (
              expected, expected, expected, f"embykeeper=={expected}"
          ):
              raise SystemExit("The tag, Python package and Windows installer versions do not match.")
          PY
      - name: Build bundled PyAES wheel
        run: python -m pip wheel --no-deps pyaes==1.6.1 --wheel-dir windows/installer-script/wheels
      - name: Wait for the release wheel
        timeout-minutes: 12
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          wheel="embykeeper-${RELEASE_TAG#v}-py3-none-any.whl"
          for attempt in {1..30}; do
            if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" \
              --jq '.assets[] | select(.state == "uploaded") | .name' | grep -Fxq "$wheel"; then
              exit 0
            fi
            echo "Waiting for $wheel ($attempt/30)."
            sleep 20
          done
          echo "::error::The release wheel is unavailable. Finish the Python package release build, then rerun this job."
          exit 1
      - name: Archive Windows Installer Script Version
        uses: thedoctor0/zip-release@0.7.1
        with:
          type: 'zip'
          filename: ${{ env.WIN_SCRIPT_ZIP_NAME }}
          directory: 'windows/installer-script'
          exclusions: 'python-* desktop.ini'
      - name: "Upload to Artifact"
        uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: ${{ env.WIN_SCRIPT_ZIP_NAME }}
          path: windows/installer-script/${{ env.WIN_SCRIPT_ZIP_NAME }}
      - name: "Upload to GitHub Release"
        if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        run: |
          gh release upload "${{ env.RELEASE_TAG }}" "windows/installer-script/${{ env.WIN_SCRIPT_ZIP_NAME }}" --repo "${{ github.repository }}" --clobber

  win-gui:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
      - name: Build PyAES
        run: |
          pip wheel pyaes==1.6.1 -w windows/installer-gui/Resources
      - name: Install NSIS
        run: |
          choco install nsis -y --no-progress
          echo "C:\Program Files (x86)\NSIS" >> $env:GITHUB_PATH
      - name: Build Windows Installer GUI Version
        run: |
          python -m pip install -U pynsistfix
          pynsist installer.cfg
          mv build/nsis/Embykeeper.exe ${{ env.WIN_GUI_EXE_NAME }}
      - name: "Upload to Artifact"
        uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: ${{ env.WIN_GUI_EXE_NAME }}
          path: ${{ env.WIN_GUI_EXE_NAME }}
      - name: "Upload to GitHub Release"
        if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        run: |
          gh release upload "${{ env.RELEASE_TAG }}" "${{ env.WIN_GUI_EXE_NAME }}" --repo "${{ github.repository }}" --clobber
